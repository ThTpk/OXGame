<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมส์ OX (Tic-Tac-Toe) - Modern Edition</title>
    <!-- โหลดฟอนต์ Prompt และ Inter สำหรับภาษาไทยและตัวเลขที่คมชัดทันสมัย -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ตั้งค่าฟอนต์หลักและธีมพื้นหลัง */
        body {
            font-family: 'Prompt', 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a 50%, #020617 100%);
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* เอฟเฟกต์แสงพื้นหลัง (Ambient Glow Orbs) */
        .orb-1 {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 45vw;
            height: 45vw;
            max-width: 500px;
            max-height: 500px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
            animation: floatOrb 12s ease-in-out infinite alternate;
        }

        .orb-2 {
            position: fixed;
            bottom: -10%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            max-width: 550px;
            max-height: 550px;
            background: radial-gradient(circle, rgba(244, 63, 94, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
            animation: floatOrb 15s ease-in-out infinite alternate-reverse;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 25px) scale(1.1); }
        }

        /* สไตล์ Glassmorphism Card */
        .glass-panel {
            background: rgba(30, 41, 59, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* ช่องตาราง 3x3 */
        .cell {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            cursor: pointer;
        }

        .cell:hover:not(.occupied):not(.game-over) {
            background: rgba(51, 65, 85, 0.6);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.3);
        }

        .cell:active:not(.occupied):not(.game-over) {
            transform: scale(0.95);
        }

        .cell.occupied, .cell.game-over {
            cursor: default;
        }

        /* ไฮไลต์ช่องที่ชนะ */
        .cell.win-x {
            background: rgba(56, 189, 248, 0.18);
            border-color: rgba(56, 189, 248, 0.6);
            box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.25);
        }

        .cell.win-o {
            background: rgba(244, 63, 94, 0.18);
            border-color: rgba(244, 63, 94, 0.6);
            box-shadow: inset 0 0 20px rgba(244, 63, 94, 0.25);
        }

        /* แอนิเมชันการวาดเส้น SVG ของตัว X และ O */
        .mark-x path {
            stroke: #38bdf8;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawMark 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
        }

        .mark-x path:nth-child(2) {
            animation-delay: 0.12s;
        }

        .mark-o circle {
            stroke: #f43f5e;
            stroke-dasharray: 220;
            stroke-dashoffset: 220;
            animation: drawMark 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            filter: drop-shadow(0 0 8px rgba(244, 63, 94, 0.6));
        }

        @keyframes drawMark {
            to {
                stroke-dashoffset: 0;
            }
        }

        /* เส้นขีดฆ่าเมื่อชนะ */
        #win-line {
            stroke-dasharray: 450;
            stroke-dashoffset: 450;
            transition: stroke-dashoffset 0.55s cubic-bezier(0.22, 1, 0.36, 1);
            stroke-linecap: round;
        }

        #win-line.active {
            stroke-dashoffset: 0;
        }

        /* ปุ่มกดสไตล์เกมทันสมัย */
        .btn-game {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-game:hover {
            transform: translateY(-1px);
        }
        .btn-game:active {
            transform: scale(0.96);
        }

        /* ป๊อปอัปแจ้งเตือนผลลัพธ์ (Banner) */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.85) translateY(8px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop {
            animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 sm:p-6">

    <!-- แสงเรืองรองพื้นหลัง -->
    <div class="orb-1"></div>
    <div class="orb-2"></div>

    <!-- คอนเทนเนอร์หลัก -->
    <main class="w-full max-w-md glass-panel rounded-3xl p-5 sm:p-7 flex flex-col gap-5 relative">

        <!-- ส่วนหัว: ชื่อเกม และปุ่มเปิด/ปิดเสียง -->
        <header class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-sky-400 to-rose-500 p-0.5 shadow-lg">
                    <div class="w-full h-full bg-slate-900 rounded-[14px] flex items-center justify-center font-extrabold text-sm tracking-tighter">
                        <span class="text-sky-400">O</span><span class="text-rose-500">X</span>
                    </div>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">
                        เกมส์ OX
                    </h1>
                    <p class="text-xs text-slate-400">Tic-Tac-Toe Arena</p>
                </div>
            </div>

            <!-- ปุ่มเปิด/ปิดเสียง -->
            <button id="sound-toggle" aria-label="เปิดหรือปิดเสียง" class="btn-game p-3 rounded-2xl bg-slate-800/80 hover:bg-slate-700/80 border border-white/10 text-slate-200 shadow-md flex items-center justify-center" title="เปิด/ปิดเสียงเอฟเฟกต์">
                <!-- ไอคอนลำโพงเปิดเสียง -->
                <svg id="icon-sound-on" class="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
                </svg>
                <!-- ไอคอนลำโพงปิดเสียง -->
                <svg id="icon-sound-off" class="w-5 h-5 text-slate-500 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
                </svg>
            </button>
        </header>

        <!-- ส่วนตั้งค่าโหมดการเล่น และระดับความยาก AI -->
        <section class="flex flex-col gap-3 bg-slate-900/50 p-3.5 rounded-2xl border border-white/5">
            <!-- สวิตช์เลือกโหมด PvP / PvAI -->
            <div class="grid grid-cols-2 gap-2 p-1 bg-slate-950/70 rounded-xl border border-white/5">
                <button id="mode-ai" class="btn-game py-2 px-3 rounded-lg text-xs sm:text-sm font-medium transition-all bg-gradient-to-r from-sky-500 to-indigo-600 text-white shadow-md">
                    🤖 เล่นกับ AI
                </button>
                <button id="mode-pvp" class="btn-game py-2 px-3 rounded-lg text-xs sm:text-sm font-medium transition-all text-slate-400 hover:text-white">
                    👥 เล่น 2 คน
                </button>
            </div>

            <!-- ตัวเลือกระดับความยาก AI (แสดงเฉพาะโหมดเล่นกับ AI) -->
            <div id="ai-difficulty-panel" class="flex items-center justify-between gap-2 pt-1 transition-all">
                <span class="text-xs text-slate-400 font-medium pl-1">ระดับ AI:</span>
                <div class="flex gap-1.5 flex-1 justify-end">
                    <button data-diff="easy" class="diff-btn btn-game px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800/80 text-slate-400 hover:text-white border border-white/5">
                        ง่าย
                    </button>
                    <button data-diff="medium" class="diff-btn btn-game px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800/80 text-slate-400 hover:text-white border border-white/5">
                        ปานกลาง
                    </button>
                    <button data-diff="hard" class="diff-btn btn-game px-3 py-1.5 rounded-lg text-xs font-medium bg-rose-500/20 text-rose-300 border border-rose-500/40 shadow-sm">
                        ยาก (ไร้พ่าย)
                    </button>
                </div>
            </div>
        </section>

        <!-- แถบแสดงสถานะเทิร์นปัจจุบัน หรือผลการแข่งขัน -->
        <div id="status-banner" class="py-2.5 px-4 rounded-2xl bg-slate-800/70 border border-white/10 text-center flex items-center justify-center gap-2 min-h-[46px]">
            <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-sky-400 animate-pulse"></span>
            <span id="status-text" class="text-sm sm:text-base font-medium text-slate-100">ตาของ <strong class="text-sky-400">X</strong> (คุณ)</span>
        </div>

        <!-- กระดานเกมส์ขนาด 3x3 พร้อม SVG เส้นขีดฆ่า -->
        <div class="relative w-full aspect-square max-w-[360px] mx-auto">
            <div id="board" class="grid grid-cols-3 grid-rows-3 gap-2.5 sm:gap-3 w-full h-full">
                <!-- ช่องทั้ง 9 ช่องจะถูกสร้างด้วย JavaScript -->
            </div>

            <!-- เลเยอร์ SVG สำหรับลากเส้นขีดฆ่าผู้ชนะ -->
            <svg id="win-line-svg" class="absolute inset-0 w-full h-full pointer-events-none z-10" viewBox="0 0 300 300">
                <line id="win-line" x1="0" y1="0" x2="0" y2="0" stroke="#38bdf8" stroke-width="8" />
            </svg>
        </div>

        <!-- แผงนับคะแนนสะสม -->
        <section class="grid grid-cols-3 gap-2.5 text-center">
            <!-- คะแนน X -->
            <div class="bg-sky-950/40 border border-sky-500/20 rounded-2xl p-2.5 sm:p-3 flex flex-col items-center">
                <span id="label-x" class="text-xs font-medium text-sky-400">ผู้เล่น X (คุณ)</span>
                <span id="score-x" class="text-xl sm:text-2xl font-extrabold text-white mt-0.5 font-['Inter']">0</span>
            </div>
            <!-- เสมอ -->
            <div class="bg-slate-800/50 border border-white/10 rounded-2xl p-2.5 sm:p-3 flex flex-col items-center">
                <span class="text-xs font-medium text-slate-400">เสมอ</span>
                <span id="score-draw" class="text-xl sm:text-2xl font-extrabold text-slate-200 mt-0.5 font-['Inter']">0</span>
            </div>
            <!-- คะแนน O -->
            <div class="bg-rose-950/40 border border-rose-500/20 rounded-2xl p-2.5 sm:p-3 flex flex-col items-center">
                <span id="label-o" class="text-xs font-medium text-rose-400">AI (O)</span>
                <span id="score-o" class="text-xl sm:text-2xl font-extrabold text-white mt-0.5 font-['Inter']">0</span>
            </div>
        </section>

        <!-- ปุ่มควบคุม: เริ่มเกมใหม่ และ รีเซ็ตคะแนน -->
        <footer class="grid grid-cols-2 gap-3 pt-1">
            <button id="btn-new-game" class="btn-game py-3 px-4 rounded-2xl bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white font-semibold text-sm shadow-lg shadow-sky-500/25 flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
                เริ่มเกมใหม่
            </button>
            <button id="btn-reset-score" class="btn-game py-3 px-4 rounded-2xl bg-slate-800/90 hover:bg-slate-700/90 text-slate-300 hover:text-white border border-white/10 font-medium text-sm shadow-md flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
                รีเซ็ตคะแนน
            </button>
        </footer>

    </main>

    <script>
        /**
         * ระบบเสียงสังเคราะห์ด้วย Web Audio API (ไม่ต้องใช้ไฟล์เสียงภายนอก)
         */
        class SoundFX {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTone(freq, type, duration, delay = 0, gainVal = 0.15) {
                if (!this.enabled) return;
                try {
                    this.init();
                    if (!this.ctx) return;

                    const now = this.ctx.currentTime + delay;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, now);

                    gain.gain.setValueAtTime(gainVal, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + duration);
                } catch (e) {
                    // ข้ามข้อผิดพลาดหากเบราว์เซอร์บล็อกเสียงก่อนการโต้ตอบ
                }
            }

            playMoveX() {
                this.playTone(520, 'sine', 0.14, 0, 0.16);
                this.playTone(780, 'triangle', 0.12, 0.04, 0.1);
            }

            playMoveO() {
                this.playTone(390, 'sine', 0.16, 0, 0.18);
                this.playTone(290, 'triangle', 0.14, 0.04, 0.1);
            }

            playClick() {
                this.playTone(650, 'sine', 0.07, 0, 0.08);
            }

            playWin() {
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    this.playTone(freq, 'triangle', 0.28, idx * 0.09, 0.16);
                });
            }

            playLose() {
                const notes = [440, 392, 349.23, 293.66]; // A4, G4, F4, D4
                notes.forEach((freq, idx) => {
                    this.playTone(freq, 'sawtooth', 0.25, idx * 0.11, 0.09);
                });
            }

            playDraw() {
                this.playTone(440, 'sine', 0.18, 0, 0.12);
                this.playTone(440, 'sine', 0.22, 0.18, 0.12);
            }
        }

        /**
         * คลาสหลักควบคุมตรรกะและหน้าจอของเกมส์ OX
         */
        class TicTacToeGame {
            constructor() {
                this.board = Array(9).fill(null);
                this.currentPlayer = 'X';
                this.gameMode = 'ai'; // 'ai' หรือ 'pvp'
                this.difficulty = 'hard'; // 'easy', 'medium', 'hard'
                this.isGameOver = false;
                this.isAiThinking = false;
                this.scores = { X: 0, O: 0, draw: 0 };
                this.sfx = new SoundFX();

                // รูปแบบการชนะทั้ง 8 แนว และพิกัดสำหรับเส้นขีดฆ่า SVG (viewBox 300x300)
                this.winPatterns = [
                    { combo: [0, 1, 2], line: { x1: 25, y1: 50, x2: 275, y2: 50 } },     // แนวนอนบน
                    { combo: [3, 4, 5], line: { x1: 25, y1: 150, x2: 275, y2: 150 } },   // แนวนอนกลาง
                    { combo: [6, 7, 8], line: { x1: 25, y1: 250, x2: 275, y2: 250 } },   // แนวนอนล่าง
                    { combo: [0, 3, 6], line: { x1: 50, y1: 25, x2: 50, y2: 275 } },     // แนวตั้งซ้าย
                    { combo: [1, 4, 7], line: { x1: 150, y1: 25, x2: 150, y2: 275 } },   // แนวตั้งกลาง
                    { combo: [2, 5, 8], line: { x1: 250, y1: 25, x2: 250, y2: 275 } },   // แนวตั้งขวา
                    { combo: [0, 4, 8], line: { x1: 30, y1: 30, x2: 270, y2: 270 } },     // ทะแยงซ้ายบน-ขวาล่าง
                    { combo: [2, 4, 6], line: { x1: 270, y1: 30, x2: 30, y2: 270 } }      // ทะแยงขวาบน-ซ้ายล่าง
                ];

                this.cacheDOM();
                this.bindEvents();
                this.createBoardUI();
                this.updateLabels();
                this.updateStatusUI();
            }

            cacheDOM() {
                this.boardEl = document.getElementById('board');
                this.winLineEl = document.getElementById('win-line');
                this.statusTextEl = document.getElementById('status-text');
                this.statusDotEl = document.getElementById('status-dot');
                this.statusBannerEl = document.getElementById('status-banner');

                this.scoreXEl = document.getElementById('score-x');
                this.scoreOEl = document.getElementById('score-o');
                this.scoreDrawEl = document.getElementById('score-draw');
                this.labelXEl = document.getElementById('label-x');
                this.labelOEl = document.getElementById('label-o');

                this.modeAiBtn = document.getElementById('mode-ai');
                this.modePvpBtn = document.getElementById('mode-pvp');
                this.aiDiffPanel = document.getElementById('ai-difficulty-panel');
                this.diffBtns = document.querySelectorAll('.diff-btn');

                this.newGameBtn = document.getElementById('btn-new-game');
                this.resetScoreBtn = document.getElementById('btn-reset-score');
                this.soundToggleBtn = document.getElementById('sound-toggle');
                this.iconSoundOn = document.getElementById('icon-sound-on');
                this.iconSoundOff = document.getElementById('icon-sound-off');
            }

            bindEvents() {
                // เลือกโหมดการเล่น
                this.modeAiBtn.addEventListener('click', () => this.setGameMode('ai'));
                this.modePvpBtn.addEventListener('click', () => this.setGameMode('pvp'));

                // เลือกระดับความยาก AI
                this.diffBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.setDifficulty(btn.dataset.diff);
                    });
                });

                // ปุ่มเริ่มเกมใหม่ & รีเซ็ตคะแนน
                this.newGameBtn.addEventListener('click', () => {
                    this.sfx.playClick();
                    this.resetBoard();
                });

                this.resetScoreBtn.addEventListener('click', () => {
                    this.sfx.playClick();
                    this.resetScores();
                });

                // ปุ่มเปิด/ปิดเสียง
                this.soundToggleBtn.addEventListener('click', () => {
                    this.sfx.enabled = !this.sfx.enabled;
                    if (this.sfx.enabled) {
                        this.sfx.playClick();
                        this.iconSoundOn.classList.remove('hidden');
                        this.iconSoundOff.classList.add('hidden');
                    } else {
                        this.iconSoundOn.classList.add('hidden');
                        this.iconSoundOff.classList.remove('hidden');
                    }
                });
            }

            createBoardUI() {
                this.boardEl.innerHTML = '';
                for (let i = 0; i < 9; i++) {
                    const cell = document.createElement('button');
                    cell.type = 'button';
                    cell.setAttribute('aria-label', `ช่องที่ ${i + 1}`);
                    cell.className = 'cell rounded-2xl flex items-center justify-center p-4 sm:p-5 focus:outline-none focus:ring-2 focus:ring-sky-400/50';
                    cell.dataset.index = i;
                    cell.addEventListener('click', () => this.handleCellClick(i));
                    this.boardEl.appendChild(cell);
                }
            }

            setGameMode(mode) {
                if (this.gameMode === mode) return;
                this.sfx.playClick();
                this.gameMode = mode;

                if (mode === 'ai') {
                    this.modeAiBtn.className = 'btn-game py-2 px-3 rounded-lg text-xs sm:text-sm font-medium transition-all bg-gradient-to-r from-sky-500 to-indigo-600 text-white shadow-md';
                    this.modePvpBtn.className = 'btn-game py-2 px-3 rounded-lg text-xs sm:text-sm font-medium transition-all text-slate-400 hover:text-white';
                    this.aiDiffPanel.classList.remove('hidden');
                } else {
                    this.modePvpBtn.className = 'btn-game py-2 px-3 rounded-lg text-xs sm:text-sm font-medium transition-all bg-gradient-to-r from-sky-500 to-indigo-600 text-white shadow-md';
                    this.modeAiBtn.className = 'btn-game py-2 px-3 rounded-lg text-xs sm:text-sm font-medium transition-all text-slate-400 hover:text-white';
                    this.aiDiffPanel.classList.add('hidden');
                }

                this.updateLabels();
                this.resetScores();
            }

            setDifficulty(diff) {
                if (this.difficulty === diff) return;
                this.sfx.playClick();
                this.difficulty = diff;

                this.diffBtns.forEach(btn => {
                    const isSelected = btn.dataset.diff === diff;
                    if (isSelected) {
                        if (diff === 'easy') {
                            btn.className = 'diff-btn btn-game px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 shadow-sm';
                        } else if (diff === 'medium') {
                            btn.className = 'diff-btn btn-game px-3 py-1.5 rounded-lg text-xs font-medium bg-amber-500/20 text-amber-300 border border-amber-500/40 shadow-sm';
                        } else {
                            btn.className = 'diff-btn btn-game px-3 py-1.5 rounded-lg text-xs font-medium bg-rose-500/20 text-rose-300 border border-rose-500/40 shadow-sm';
                        }
                    } else {
                        btn.className = 'diff-btn btn-game px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800/80 text-slate-400 hover:text-white border border-white/5';
                    }
                });

                this.resetBoard();
            }

            updateLabels() {
                if (this.gameMode === 'ai') {
                    this.labelXEl.textContent = 'ผู้เล่น X (คุณ)';
                    this.labelOEl.textContent = 'AI (O)';
                } else {
                    this.labelXEl.textContent = 'ผู้เล่น 1 (X)';
                    this.labelOEl.textContent = 'ผู้เล่น 2 (O)';
                }
            }

            handleCellClick(index) {
                if (this.isGameOver || this.isAiThinking || this.board[index] !== null) {
                    return;
                }

                this.makeMove(index, this.currentPlayer);

                // หากยังไม่จบเกมและเป็นโหมดเล่นกับ AI ให้ AI เดินหมากต่อ
                if (!this.isGameOver && this.gameMode === 'ai' && this.currentPlayer === 'O') {
                    this.isAiThinking = true;
                    this.updateStatusUI();
                    setTimeout(() => {
                        if (!this.isGameOver) {
                            const aiIndex = this.getBestAiMove();
                            if (aiIndex !== -1) {
                                this.makeMove(aiIndex, 'O');
                            }
                        }
                        this.isAiThinking = false;
                        if (!this.isGameOver) {
                            this.updateStatusUI();
                        }
                    }, 420); // หน่วงเวลาเล็กน้อยให้ดูเป็นธรรมชาติ
                }
            }

            makeMove(index, player) {
                this.board[index] = player;
                const cellEl = this.boardEl.children[index];
                cellEl.classList.add('occupied');

                // วาด SVG หมาก X หรือ O พร้อมแอนิเมชัน
                if (player === 'X') {
                    this.sfx.playMoveX();
                    cellEl.innerHTML = `
                        <svg class="w-full h-full mark-x" viewBox="0 0 100 100">
                            <path d="M 22 22 L 78 78" stroke-width="11" stroke-linecap="round" fill="none" />
                            <path d="M 78 22 L 22 78" stroke-width="11" stroke-linecap="round" fill="none" />
                        </svg>
                    `;
                } else {
                    this.sfx.playMoveO();
                    cellEl.innerHTML = `
                        <svg class="w-full h-full mark-o" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="32" stroke-width="11" fill="none" />
                        </svg>
                    `;
                }

                // ตรวจสอบผลแพ้ชนะหรือเสมอ
                const winResult = this.checkWinner(this.board);
                if (winResult) {
                    this.handleWin(winResult);
                    return;
                }

                if (!this.board.includes(null)) {
                    this.handleDraw();
                    return;
                }

                // สลับเทิร์นผู้เล่น
                this.currentPlayer = this.currentPlayer === 'X' ? 'O' : 'X';
                this.updateStatusUI();
            }

            checkWinner(boardState) {
                for (const pattern of this.winPatterns) {
                    const [a, b, c] = pattern.combo;
                    if (
                        boardState[a] &&
                        boardState[a] === boardState[b] &&
                        boardState[a] === boardState[c]
                    ) {
                        return {
                            winner: boardState[a],
                            combo: pattern.combo,
                            line: pattern.line
                        };
                    }
                }
                return null;
            }

            handleWin(result) {
                this.isGameOver = true;
                const { winner, combo, line } = result;

                // เพิ่มคะแนน
                this.scores[winner]++;
                this.updateScoreUI();

                // ไฮไลต์ช่องที่ชนะและล็อคกระดาน
                Array.from(this.boardEl.children).forEach((cell, idx) => {
                    cell.classList.add('game-over');
                    if (combo.includes(idx)) {
                        cell.classList.add(winner === 'X' ? 'win-x' : 'win-o');
                    }
                });

                // ลากเส้นขีดฆ่าผู้ชนะ
                this.winLineEl.setAttribute('x1', line.x1);
                this.winLineEl.setAttribute('y1', line.y1);
                this.winLineEl.setAttribute('x2', line.x2);
                this.winLineEl.setAttribute('y2', line.y2);
                this.winLineEl.setAttribute('stroke', winner === 'X' ? '#38bdf8' : '#f43f5e');
                this.winLineEl.style.filter = winner === 'X'
                    ? 'drop-shadow(0 0 10px rgba(56, 189, 248, 0.85))'
                    : 'drop-shadow(0 0 10px rgba(244, 63, 94, 0.85))';

                // ใช้ requestAnimationFrame เพื่อให้ CSS transition ทำงานลื่นไหล
                requestAnimationFrame(() => {
                    this.winLineEl.classList.add('active');
                });

                // เล่นเสียงและแสดงข้อความผลลัพธ์
                this.statusDotEl.classList.add('hidden');
                this.statusBannerEl.classList.remove('animate-pop');
                void this.statusBannerEl.offsetWidth; // trigger reflow
                this.statusBannerEl.classList.add('animate-pop');

                if (this.gameMode === 'ai') {
                    if (winner === 'X') {
                        this.sfx.playWin();
                        this.statusTextEl.innerHTML = '🎉 ยินดีด้วย! <strong class="text-sky-400">คุณเป็นฝ่ายชนะ</strong>';
                    } else {
                        this.sfx.playLose();
                        this.statusTextEl.innerHTML = '🤖 <strong class="text-rose-400">AI ชนะ</strong> ลองใหม่อีกครั้งนะ!';
                    }
                } else {
                    this.sfx.playWin();
                    const colorClass = winner === 'X' ? 'text-sky-400' : 'text-rose-400';
                    const playerNum = winner === 'X' ? 'ผู้เล่น 1 (X)' : 'ผู้เล่น 2 (O)';
                    this.statusTextEl.innerHTML = `🏆 <strong class="${colorClass}">${playerNum}</strong> เป็นฝ่ายชนะ!`;
                }
            }

            handleDraw() {
                this.isGameOver = true;
                this.scores.draw++;
                this.updateScoreUI();

                Array.from(this.boardEl.children).forEach(cell => cell.classList.add('game-over'));

                this.sfx.playDraw();
                this.statusDotEl.classList.add('hidden');
                this.statusBannerEl.classList.remove('animate-pop');
                void this.statusBannerEl.offsetWidth;
                this.statusBannerEl.classList.add('animate-pop');
                this.statusTextEl.innerHTML = '🤝 <strong class="text-amber-300">เสมอกัน!</strong> สูสีมาก';
            }

            updateStatusUI() {
                this.statusDotEl.classList.remove('hidden');

                if (this.gameMode === 'ai') {
                    if (this.currentPlayer === 'X') {
                        this.statusDotEl.className = 'w-2.5 h-2.5 rounded-full bg-sky-400 animate-pulse';
                        this.statusTextEl.innerHTML = 'ตาของ <strong class="text-sky-400">X</strong> (คุณ)';
                    } else {
                        this.statusDotEl.className = 'w-2.5 h-2.5 rounded-full bg-rose-400 animate-ping';
                        this.statusTextEl.innerHTML = '<strong class="text-rose-400">AI (O)</strong> กำลังคิด...';
                    }
                } else {
                    if (this.currentPlayer === 'X') {
                        this.statusDotEl.className = 'w-2.5 h-2.5 rounded-full bg-sky-400 animate-pulse';
                        this.statusTextEl.innerHTML = 'ตาของ <strong class="text-sky-400">ผู้เล่น 1 (X)</strong>';
                    } else {
                        this.statusDotEl.className = 'w-2.5 h-2.5 rounded-full bg-rose-400 animate-pulse';
                        this.statusTextEl.innerHTML = 'ตาของ <strong class="text-rose-400">ผู้เล่น 2 (O)</strong>';
                    }
                }
            }

            updateScoreUI() {
                this.scoreXEl.textContent = this.scores.X;
                this.scoreOEl.textContent = this.scores.O;
                this.scoreDrawEl.textContent = this.scores.draw;
            }

            resetBoard() {
                this.board = Array(9).fill(null);
                this.currentPlayer = 'X';
                this.isGameOver = false;
                this.isAiThinking = false;

                // รีเซ็ตเส้นขีดฆ่า
                this.winLineEl.classList.remove('active');
                this.winLineEl.setAttribute('x1', 0);
                this.winLineEl.setAttribute('y1', 0);
                this.winLineEl.setAttribute('x2', 0);
                this.winLineEl.setAttribute('y2', 0);

                // ล้างช่องบนกระดาน
                Array.from(this.boardEl.children).forEach(cell => {
                    cell.innerHTML = '';
                    cell.className = 'cell rounded-2xl flex items-center justify-center p-4 sm:p-5 focus:outline-none focus:ring-2 focus:ring-sky-400/50';
                });

                this.updateStatusUI();
            }

            resetScores() {
                this.scores = { X: 0, O: 0, draw: 0 };
                this.updateScoreUI();
                this.resetBoard();
            }

            /**
             * ระบบปัญญาประดิษฐ์ (AI) แบ่งตาม 3 ระดับความยาก
             */
            getBestAiMove() {
                const availableMoves = this.board
                    .map((val, idx) => (val === null ? idx : null))
                    .filter(val => val !== null);

                if (availableMoves.length === 0) return -1;

                // ระดับง่าย: สุ่มเลือกช่องว่าง
                if (this.difficulty === 'easy') {
                    return availableMoves[Math.floor(Math.random() * availableMoves.length)];
                }

                // ระดับปานกลาง: ผสมระหว่าง Minimax (60%) และเดินสุ่ม (40%)
                if (this.difficulty === 'medium') {
                    if (Math.random() < 0.4) {
                        return availableMoves[Math.floor(Math.random() * availableMoves.length)];
                    }
                }

                // ระดับยาก (หรือจังหวะฉลาดของปานกลาง): ใช้ Minimax Algorithm
                // เพิ่มความเร็วในตาแรกของ AI หากช่องกลางว่างให้ยึดช่องกลางทันที
                if (availableMoves.length === 8 && this.board[4] === null) {
                    return 4;
                }

                let bestScore = -Infinity;
                let bestMoves = [];

                for (const index of availableMoves) {
                    this.board[index] = 'O';
                    const score = this.minimax(this.board, 0, false);
                    this.board[index] = null;

                    if (score > bestScore) {
                        bestScore = score;
                        bestMoves = [index];
                    } else if (score === bestScore) {
                        bestMoves.push(index);
                    }
                }

                // สุ่มเลือกหากมีหลายตาเดินที่ได้คะแนนสูงสุดเท่ากัน เพื่อไม่ให้จำเจ
                return bestMoves[Math.floor(Math.random() * bestMoves.length)];
            }

            /**
             * อัลกอริทึม Minimax คำนวณตาเดินที่สมบูรณ์แบบที่สุด
             */
            minimax(boardState, depth, isMaximizing) {
                const result = this.checkWinner(boardState);
                if (result !== null) {
                    if (result.winner === 'O') return 10 - depth;
                    if (result.winner === 'X') return depth - 10;
                }

                if (!boardState.includes(null)) {
                    return 0; // เสมอ
                }

                if (isMaximizing) {
                    let bestScore = -Infinity;
                    for (let i = 0; i < 9; i++) {
                        if (boardState[i] === null) {
                            boardState[i] = 'O';
                            const score = this.minimax(boardState, depth + 1, false);
                            boardState[i] = null;
                            bestScore = Math.max(score, bestScore);
                        }
                    }
                    return bestScore;
                } else {
                    let bestScore = Infinity;
                    for (let i = 0; i < 9; i++) {
                        if (boardState[i] === null) {
                            boardState[i] = 'X';
                            const score = this.minimax(boardState, depth + 1, true);
                            boardState[i] = null;
                            bestScore = Math.min(score, bestScore);
                        }
                    }
                    return bestScore;
                }
            }
        }

        // เริ่มต้นเกมเมื่อโหลดหน้าเว็บเสร็จสมบูรณ์
        window.addEventListener('DOMContentLoaded', () => {
            new TicTacToeGame();
        });
    </script>
